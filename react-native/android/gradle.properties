# Modest daemon memory: the sample builds on a laptop next to an emulator.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
android.useAndroidX=true

# Phones and emulators on arm64 and x86_64. Add armeabi-v7a,x86 for older devices.
reactNativeArchitectures=arm64-v8a,x86_64

newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=false

